[package]
name = "nekto-translate-desktop"
version = "0.2.0"
description = "Desktop shell for NektoTranslate"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nekto_translate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
ureq = "3.4.1"
rfd = "0.17.2"
# Only for formatting the updater's own timestamps (Update::date, pending.json's downloaded_at) as
# ISO 8601/RFC 3339 - already a transitive dependency of tauri-plugin-updater, which is where
# `Update::date`'s `OffsetDateTime` type comes from.
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
